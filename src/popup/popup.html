<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>ChatGPTLiteUI</title>
  </head>
  <body>
    <main class="cgl-popup">
      <h1 class="cgl-title">ChatGPTLiteUI</h1>

      <label class="cgl-row">
        <span>Extension enabled</span>
        <input type="checkbox" id="enabled" />
      </label>

      <label class="cgl-row">
        <span>Preset</span>
        <select id="preset">
          <option value="normal">Normal</option>
          <option value="minimal">Minimal</option>
          <option value="work">Work</option>
          <option value="ultra-lite">Ultra Lite</option>
          <option value="custom" disabled>Custom (current)</option>
        </select>
      </label>

      <label class="cgl-row">
        <span>Sidebar</span>
        <select id="sidebar">
          <option value="visible">Visible</option>
          <option value="hover">Hover</option>
          <option value="button">Button</option>
          <option value="hidden">Hidden</option>
        </select>
      </label>

      <section class="cgl-section">
        <h2>Writing copy</h2>
        <label class="cgl-row">
          <span>Enable floating copy control</span>
          <input type="checkbox" id="writingCopyEnabled" />
        </label>
        <p class="cgl-note">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd></p>
        <p class="cgl-note">
          Copied content is not stored, and the clipboard is never read.
          <a class="cgl-link" id="open-options-writing" href="#options">Options for position &amp; shortcut</a>
        </p>
      </section>

      <section class="cgl-section">
        <h2>This chat background</h2>
        <p class="cgl-note" id="chat-identity">Checking chat…</p>
        <label class="cgl-row">
          <span>Use custom background</span>
          <input type="checkbox" id="chatBackgroundEnabled" />
        </label>
        <label class="cgl-row">
          <span>Background color</span>
          <input type="color" id="chatBackgroundColor" value="#101827" />
        </label>
        <div class="cgl-row">
          <span>Reset this chat</span>
          <button id="chatBackgroundReset" type="button">Reset</button>
        </div>
      </section>

      <p class="cgl-note" id="status">Loading settings…</p>
      <p class="cgl-note">Temporary toggle shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd></p>
      <a class="cgl-link" id="open-options" href="#">Open options</a>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
